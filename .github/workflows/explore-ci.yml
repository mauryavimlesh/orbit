name: Explore foundation
on:
  pull_request:
    paths:
      - 'apps/explore/**'
      - '.github/workflows/explore-ci.yml'
  push:
    branches: [main]
    paths:
      - 'apps/explore/**'
      - '.github/workflows/explore-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: explore-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        node: ['22', '24']
    defaults:
      run:
        working-directory: apps/explore
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --ignore-scripts --offline --no-audit --no-fund
      - run: npm run check
